{% set name = "pgcli" %}
{% set version = "4.6.0" %}
{% set sha256 = "4b0633a6ce753ea38fb1fe2dc54b66b732c4d0b29fadf48cad78b2e7f6636d9d" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  entry_points:
    - pgcli=pgcli.main:cli

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - pgspecial >=2.0.0
    - click >=4.1,!=8.1.8,!=8.2.*,!=8.3.0,<9
    - cli_helpers >=2.4.0
    - pygments >=2.0
    - prompt_toolkit >=2.0.6,<4.0.0
    - psycopg >=3.0.14
    - sqlparse >=0.3.0,<0.7
    - configobj >=5.0.6
    - setproctitle >=1.1.9
    - tzlocal >=5.2

test:
  requires:
    - python {{ python_min }}
  imports:
    - pgcli
    - pgcli.packages
    - pgcli.packages.parseutils
    - pgcli.packages.pgliterals
  commands:
    - pgcli --help

about:
  home: http://pgcli.com
  license: BSD-3-Clause
  license_file: LICENSE.txt
  license_family: BSD
  # xref: https://github.com/dbcli/pgcli/pull/728
  #license_file: LICENSE.txt
  summary: CLI for Postgres Database. With auto-completion and syntax highlighting.
  doc_url: http://simplejson.readthedocs.io/
  dev_url: https://github.com/dbcli/pgcli

extra:
  recipe-maintainers:
    - mariusvniekerk
    - dhirschfeld
